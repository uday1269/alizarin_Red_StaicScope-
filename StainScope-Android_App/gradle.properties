# Project-wide Gradle settings.

# Ensure Gradle uses Android Studio JBR
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# Workaround for jlink executable not found error
android.jdk.image.transform.enabled=false
android.experimental.jdk.image.transform.enabled=false

# JVM settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# AndroidX and performance settings
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.caching=true
